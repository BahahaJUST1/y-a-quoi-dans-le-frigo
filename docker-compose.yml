services:
  mysql:
    image: mysql:5.7
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10

  backend:
    build: ./packages/backend
    container_name: backend
    restart: always
    env_file:
      - ./packages/backend/.env
    volumes:
      - ./packages/backend/src:/app/src
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - app-network

  frontend:
    build:
      context: ./packages/frontend
      args:
        - REACT_APP_CLOUDINARY_NAME=${REACT_APP_CLOUDINARY_NAME}
        - REACT_APP_CLOUDINARY_KEY=${REACT_APP_CLOUDINARY_KEY}
        - REACT_APP_CLOUDINARY_SECRET=${REACT_APP_CLOUDINARY_SECRET}
    container_name: frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3001:80"
    networks:
      - app-network
    env_file:
      - ./packages/frontend/.env

  nginx:
    image: nginx:alpine
    container_name: reverse_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend
      - backend

networks:
  app-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
