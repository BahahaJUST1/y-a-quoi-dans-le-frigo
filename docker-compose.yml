services:
  mysql:
    image: mysql:5.7
    container_name: mysql
    restart: always
    env_file:
      - ./packages/backend/.env
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - app-network

  backend:
    build: ./packages/backend
    container_name: backend
    restart: always
    env_file:
      - ./packages/backend/.env
    volumes:
      - ./packages/backend/src:/app/src
    ports:
      - "3000:3000"
    networks:
      - app-network

  frontend:
    build:
      context: ./packages/frontend
      args:
        - REACT_APP_ENV=master
    container_name: frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3001:80"
    volumes:
      - ./packages/frontend/build:/usr/share/nginx/html
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - /var/www/html/.well-known:/var/www/html/.well-known
      - /etc/letsencrypt:/etc/letsencrypt
    depends_on:
      - frontend
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
