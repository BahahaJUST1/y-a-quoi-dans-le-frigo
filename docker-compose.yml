services:
  mysql:
    image: mysql:5.7
    container_name: mysql
    restart: always
    env_file:
      - ./packages/backend/.env
    volumes:
      - mysql_data:/var/lib/mysql
      - ./packages/backend/src/database/dump.sql:/docker-entrypoint-initdb.d/dump.sql
    ports:
      - "3306:3306"
    networks:
      - app-network

  backend:
    build: ./packages/backend
    container_name: backend
    restart: always
    env_file:
      - ./packages/backend/.env
    volumes:
      - ./packages/backend/src:/app/src
    ports:
      - "3000:3000"
    networks:
      - app-network

  frontend:
    build:
      context: ./packages/frontend
      args:
        - REACT_APP_CLOUDINARY_NAME=${REACT_APP_CLOUDINARY_NAME}
        - REACT_APP_CLOUDINARY_KEY=${REACT_APP_CLOUDINARY_KEY}
        - REACT_APP_CLOUDINARY_SECRET=${REACT_APP_CLOUDINARY_SECRET}
    container_name: frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3001:80"
    networks:
      - app-network
    env_file:
      - ./packages/frontend/.env

  nginx:
    image: nginx:alpine
    container_name: proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - certbot_challenge:/var/www/certbot
      - /etc/letsencrypt:/etc/letsencrypt
    depends_on:
      - frontend
      - backend
    networks:
      - app-network

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - certbot_challenge:/var/www/certbot
      - /etc/letsencrypt:/etc/letsencrypt
    entrypoint: >
      sh -c "certbot certonly --webroot -w /var/www/certbot
      -d y-a-quoi-dans-le-frigo.fr
      -d y-a-quoi-dans-le-frigo.com
      -d y-a-quoi-dans-le-frigo.online
      --email ton-email@example.com --agree-tos --no-eff-email --force-renewal"

networks:
  app-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  certbot_challenge:
    driver: local
