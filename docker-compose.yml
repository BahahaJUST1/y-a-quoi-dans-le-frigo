services:
  mysql:
    image: mysql:5.7
    container_name: mysql
    restart: always
    env_file:
      - ./packages/backend/.env
    volumes:
      - mysql_data:/var/lib/mysql
      - ./packages/backend/src/database/dump.sql:/docker-entrypoint-initdb.d/dump.sql
    ports:
      - "3306:3306"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./packages/backend
    container_name: backend
    restart: always
    env_file:
      - ./packages/backend/.env
    volumes:
      - ./packages/backend/src:/app/src
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - app-network

  frontend:
    build:
      context: ./packages/frontend
      args:
        - REACT_APP_CLOUDINARY_NAME=${REACT_APP_CLOUDINARY_NAME}
        - REACT_APP_CLOUDINARY_KEY=${REACT_APP_CLOUDINARY_KEY}
        - REACT_APP_CLOUDINARY_SECRET=${REACT_APP_CLOUDINARY_SECRET}
    container_name: frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3001:80"
    networks:
      - app-network
    env_file:
      - ./packages/frontend/.env

  nginx:
    image: nginx:alpine
    container_name: reverse_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
