server {
    listen 80;
    server_name y-a-quoi-dans-le-frigo.fr y-a-quoi-dans-le-frigo.com y-a-quoi-dans-le-frigo.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name y-a-quoi-dans-le-frigo.fr y-a-quoi-dans-le-frigo.com y-a-quoi-dans-le-frigo.online;

    ssl_certificate /etc/letsencrypt/live/y-a-quoi-dans-le-frigo.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/y-a-quoi-dans-le-frigo.fr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://localhost:3000; # Port où tourne ton backend NestJS
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /static/ {
        root /var/www/react-app/build;
        index index.html;
    }

    location / {
        root /var/www/react-app/build;
        index index.html;
        try_files $uri /index.html;
    }
}
