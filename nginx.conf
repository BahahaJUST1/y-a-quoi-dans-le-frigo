worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    server {
        listen 80;
        server_name y-a-quoi-dans-le-frigo.fr y-a-quoi-dans-le-frigo.com y-a-quoi-dans-le-frigo.online;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        return 301 https://y-a-quoi-dans-le-frigo.fr$request_uri;
    }

    server {
        listen 443 ssl;
        server_name y-a-quoi-dans-le-frigo.fr y-a-quoi-dans-le-frigo.com y-a-quoi-dans-le-frigo.online;

        ssl_certificate /etc/letsencrypt/live/y-a-quoi-dans-le-frigo.fr/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/y-a-quoi-dans-le-frigo.fr/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 60s;
        }

        location /api/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://backend:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 60s;
        }
    }

    server {
        listen 80;
        server_name y-a-quoi-dans-le-frigo.com y-a-quoi-dans-le-frigo.online;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        return 301 https://y-a-quoi-dans-le-frigo.fr$request_uri;
    }

    server {
        listen 443 ssl;
        server_name y-a-quoi-dans-le-frigo.com y-a-quoi-dans-le-frigo.online;

        ssl_certificate /etc/letsencrypt/live/y-a-quoi-dans-le-frigo.fr/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/y-a-quoi-dans-le-frigo.fr/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        return 301 https://y-a-quoi-dans-le-frigo.fr$request_uri;
    }
}
