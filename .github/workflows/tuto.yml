name: master auto-deploy on PC2

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
      - uses: actions/checkout@v3

      - name: Deploy via SSH
        run: |
          echo "$SSH_PRIVATE_KEY" > private_key
          chmod 600 private_key

      - name: Deploy to PC2
        run: |
          ssh -o StrictHostKeyChecking=no -i private_key just1@77.195.235.151 << 'EOF'
            cd /y-a-quoi-dans-le-frigo
            git pull origin master
            docker compose down
            docker compose up -d --build
          EOF
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
